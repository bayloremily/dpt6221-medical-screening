<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Screening: Upper &amp; Lower Extremities</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="hero">
    <div class="hero__inner">
      <div class="hero-content">
        <p class="eyebrow">DPT 6221 Clinical Medicine II</p>
        <h1>Medical Screening: Upper &amp; Lower Extremities</h1>
      </div>
    </div>
  </header>

  <main id="main-content" class="slides-app">
    <section class="slide-frame" aria-labelledby="slide-title">
      <div id="slide-progress" class="slide-progress" aria-live="polite"></div>
      <div id="slide-content" class="slide-content"></div>
    </section>
  </main>

  <button id="quick-reference-btn" class="quick-reference-btn" type="button" hidden aria-haspopup="dialog" aria-controls="quick-reference-modal" aria-expanded="false">
    <span aria-hidden="true">📖</span>
    <span>Quick Reference</span>
  </button>

  <div id="reference-backdrop" class="reference-backdrop" hidden></div>
  <section
    id="quick-reference-modal"
    class="reference-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="reference-title"
    aria-describedby="reference-description"
    hidden
  >
    <div class="reference-modal__inner">
      <div class="reference-modal__header">
        <div>
          <p class="section-heading__kicker">Study Aid</p>
          <h2 id="reference-title">Quick Reference</h2>
          <p id="reference-description" class="reference-description">Review the faculty reference tables, then close this panel to return to the same activity screen.</p>
        </div>
        <button id="reference-close-btn" class="button button--ghost" type="button">Close</button>
      </div>
      <div id="reference-tabs" class="reference-tabs" role="tablist" aria-label="Quick reference sections"></div>
      <div id="reference-panel" class="reference-panel"></div>
    </div>
  </section>

  <script src="scorm.js"></script>
  <script src="script.js"></script>
</body>
</html>
